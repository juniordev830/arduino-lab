name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-portfolio-checks-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sketch-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Arduino sketch files
        run: |
          sketches="$(find . -type f -name '*.ino' -not -path './.git/*' -print)"
          if [ -z "$sketches" ]; then
            echo "::error::Nenhum sketch .ino encontrado."
            exit 1
          fi
          printf '%s\n' "$sketches"
          echo "Validação estrutural concluída. A compilação completa depende da placa e das bibliotecas do projeto."
