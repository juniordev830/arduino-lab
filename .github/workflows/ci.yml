name: Arduino Repository Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: test -f README.md
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile Blink for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno experiments/blink
      - name: Compile Button Debounce for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno experiments/button-debounce
