name: Arduino Repository Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: test -f README.md
      - name: Compile and test portable C debounce module
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic tests/debounce_test.c experiments/button-debounce/debounce.c -o /tmp/debounce_test
          /tmp/debounce_test
          gcc -std=c11 -Wall -Wextra -Werror -pedantic tools/debounce_sim.c experiments/button-debounce/debounce.c -o /tmp/debounce_sim
          /tmp/debounce_sim < tests/debounce_samples.txt | diff -u tests/debounce_expected.txt -
          if printf '0 9\n' | /tmp/debounce_sim > /tmp/bad-sample.txt 2>/tmp/bad-sample.err; then
            echo 'Expected invalid sample to be rejected'
            exit 1
          fi
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile Blink for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno experiments/blink
      - name: Compile Button Debounce for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno experiments/button-debounce
